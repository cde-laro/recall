<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Single line v4</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/helper.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e8ecf3; font-family: 'Space Grotesk', sans-serif; padding: 32px 24px 60px; }
  h1 { font-family: 'Anton', sans-serif; font-size: 22px; letter-spacing: 0.15em; text-transform: uppercase; color: #f3c969; margin-bottom: 6px; }
  .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; color: #4b5571; text-transform: uppercase; margin-bottom: 32px; }
  .ref-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.25em; color: #4b5571; text-transform: uppercase; margin-bottom: 10px; }
  .hud { background: #07090f; border: 1px solid #2c3a55; margin-bottom: 8px; }
  .scoreboard-full {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid #1c2436;
  }
  .score-col { display: flex; flex-direction: column; gap: 2px; }
  .score-col.right { align-items: flex-end; }
  .score-lbl { font-family: 'JetBrains Mono', monospace; font-size: 7px; letter-spacing: 0.3em; color: #4b5571; text-transform: uppercase; }
  .score-val { font-family: 'Anton', sans-serif; font-size: 22px; line-height: 1; }
  .score-val .sm { font-size: 11px; color: #8893a8; }
  .timer-col {
    text-align: center; border: 1px solid #2c3a55;
    clip-path: polygon(6% 0, 94% 0, 100% 20%, 100% 100%, 0 100%, 0 20%);
    padding: 4px 14px 6px;
    background: linear-gradient(180deg, rgba(211,166,74,0.08), transparent);
  }
  .timer-lbl { font-family: 'JetBrains Mono', monospace; font-size: 7px; letter-spacing: 0.28em; color: #f3c969; text-transform: uppercase; }
  .timer-val { font-family: 'Anton', sans-serif; font-size: 30px; line-height: 1; color: #f3c969; }
  .timer-val .ms { font-size: 13px; color: #8893a8; font-family: 'JetBrains Mono', monospace; }
  .input-full { display: flex; background: #11162370; border-bottom: 1px solid #2c3a55; }
  .input-full input { flex: 1; background: transparent; border: 0; color: #8893a8; font-family: 'Space Grotesk', sans-serif; font-size: 12px; padding: 10px 12px; font-style: italic; }
  .input-full .submit { background: #d6a64a; color: #07090f; border: 0; font-family: 'Anton', sans-serif; font-size: 10px; letter-spacing: 0.18em; padding: 0 14px; text-transform: uppercase; clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); }
  .progress { height: 3px; background: #1c2436; }
  .progress-fill { height: 100%; width: 18%; background: linear-gradient(90deg, #d6a64a, #f3c969); }
  .arrow { text-align: center; font-size: 16px; color: #4b5571; padding: 10px 0; max-width: 700px; }

  /* Compact line */
  .compact-line {
    display: flex; align-items: stretch; height: 48px;
  }
  .box {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 12px; border-right: 1px solid #1c2436; flex-shrink: 0; gap: 1px;
  }
  .box .lbl { font-family: 'JetBrains Mono', monospace; font-size: 7px; letter-spacing: 0.22em; color: #4b5571; text-transform: uppercase; }
  .box .num { font-family: 'Anton', sans-serif; font-size: 17px; color: #e8ecf3; line-height: 1; }
  .timer-box {
    display: flex; align-items: center; gap: 2px;
    padding: 0 14px; border-right: 1px solid #1c2436; flex-shrink: 0;
    background: linear-gradient(90deg, rgba(211,166,74,0.07), transparent);
  }
  .timer-box .t { font-family: 'Anton', sans-serif; font-size: 26px; color: #f3c969; line-height: 1; }
  .timer-box .ms { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8893a8; align-self: flex-end; margin-bottom: 2px; }
  .compact-line input {
    flex: 1; background: transparent; border: 0; color: #8893a8;
    font-family: 'Space Grotesk', sans-serif; font-size: 12px;
    padding: 0 14px; font-style: italic; outline: none;
  }
  .compact-line .submit {
    background: #d6a64a; color: #07090f; border: 0;
    font-family: 'Anton', sans-serif; font-size: 10px; letter-spacing: 0.18em;
    padding: 0 18px; text-transform: uppercase;
    clip-path: polygon(6% 0, 100% 0, 100% 100%, 0 100%); flex-shrink: 0;
  }
  .best-box {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 14px; flex-shrink: 0; gap: 1px;
    border-left: 1px solid #1c2436;
  }
  .best-box .lbl { font-family: 'JetBrains Mono', monospace; font-size: 7px; letter-spacing: 0.22em; color: #4b5571; text-transform: uppercase; }
  .best-box .num { font-family: 'Anton', sans-serif; font-size: 17px; color: #f3c969; line-height: 1; }
</style>
</head>
<body>

<h1>Found · Timer · Input · Submit · Best</h1>
<p class="subtitle">Meilleur temps à droite du bouton</p>

<p class="ref-label">▲ État complet (en haut de page)</p>
<div class="hud" style="max-width:700px;margin-bottom:4px;">
  <div class="scoreboard-full">
    <div class="score-col">
      <span class="score-lbl">Champions trouvés</span>
      <span class="score-val">001<span class="sm">/172</span></span>
    </div>
    <div class="timer-col">
      <div class="timer-lbl">Run en cours</div>
      <div class="timer-val">00:34<span class="ms">.57</span></div>
    </div>
    <div class="score-col right">
      <span class="score-lbl">Meilleur temps</span>
      <span class="score-val" style="color:#f3c969">02:14<span class="sm" style="color:#8893a8">.00</span></span>
    </div>
  </div>
  <div class="input-full">
    <input placeholder="Tape le nom d'un champion puis Entrée…" disabled>
    <div class="submit">Submit</div>
  </div>
  <div class="progress"><div class="progress-fill"></div></div>
</div>

<div class="arrow">↓ scroll</div>

<p class="ref-label">▼ État compact</p>
<div class="hud" style="max-width:700px;">
  <div class="compact-line">
    <div class="box">
      <span class="lbl">Trouvés</span>
      <span class="num">001<span style="font-size:10px;color:#4b5571">/172</span></span>
    </div>
    <div class="timer-box">
      <span class="t">00:34</span><span class="ms">.57</span>
    </div>
    <input placeholder="Tape le nom d'un champion puis Entrée…" disabled>
    <div class="submit">Submit</div>
    <div class="best-box">
      <span class="lbl">Meilleur</span>
      <span class="num">02:14<span style="font-size:10px;color:#8893a8">.00</span></span>
    </div>
  </div>
  <div class="progress"><div class="progress-fill"></div></div>
</div>

</body>
</html>
